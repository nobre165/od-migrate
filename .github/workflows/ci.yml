name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rsync shellcheck bats
      - name: shellcheck
        run: shellcheck od-migrate.sh
      - name: bats
        run: bats tests/
      # pwsh is preinstalled on ubuntu-latest. Covers the .ps1 helpers (name
      # rules vs. check_name, sizes, batch layout) and command-line errors on
      # PowerShell 7; the robocopy tests are skipped here and run in "windows".
      - name: Pester (helpers + command line, PowerShell 7)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

  windows:
    # od-migrate.ps1 targets stock Windows PowerShell 5.1, so lint and test
    # with "shell: powershell" (5.1), not pwsh.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester and PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          $r = Invoke-ScriptAnalyzer -Path od-migrate.ps1 -Severity Warning,Error
          $r | Format-Table -AutoSize -Wrap | Out-String -Width 200 | Write-Host
          if (@($r | Where-Object Severity -eq 'Error').Count -gt 0) { exit 1 }
      - name: Pester
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
